services:
  app:
    container_name: karine-app
    build:
      context: .
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.karine-http.rule=Host(`karinemascena.com.br`) || Host(`www.karinemascena.com.br`) || Host(`karinemascena.adv.br`) || Host(`147.79.110.132`)"
      - "traefik.http.routers.karine-http.entrypoints=http"
      - "traefik.http.routers.karine-http.middlewares=karine-redirect"
      - "traefik.http.middlewares.karine-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.karine.rule=Host(`karinemascena.com.br`) || Host(`www.karinemascena.com.br`) || Host(`karinemascena.adv.br`)"
      - "traefik.http.routers.karine.entrypoints=https"
      - "traefik.http.routers.karine.tls=true"
      - "traefik.http.routers.karine.tls.certresolver=letsencrypt"
      - "traefik.http.services.karine.loadbalancer.server.port=5000"
      - "traefik.docker.network=coolify"
    environment:
      DEBUG: "False"
      FLASK_APP: run.py
      SECRET_KEY: ${SERVICE_HEX_64_RASTREK:?configure SERVICE_HEX_64_RASTREK}
      ASSETS_ROOT: /static
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-karine_user}:${SERVICE_PASSWORD_64_POSTGRES:?configure SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/${POSTGRES_DB:-karine_db}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-karine@karinemascena.adv.br}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      API_INTEGRATION_KEY: ${API_INTEGRATION_KEY:?configure API_INTEGRATION_KEY}
    command:
      - /bin/sh
      - -c
      - python3 create_user.py && exec gunicorn --bind 0.0.0.0:5000 --workers 2 --access-logfile - --error-logfile - --timeout 60 run:app
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "5000"
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - app_images:/app/apps/static/images
    networks:
      - coolify
      - default
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    container_name: karine-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-karine_db}
      POSTGRES_USER: ${POSTGRES_USER:-karine_user}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES:?configure SERVICE_PASSWORD_64_POSTGRES}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  app_images:

networks:
  coolify:
    external: true
    name: coolify
  default:
    driver: bridge
