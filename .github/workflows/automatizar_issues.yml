name: Automação de Issues Idempotente

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  create-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Criar Issues (Idempotente)
        run: |
          create_issue_if_not_exists() {
            local title="$1"
            local body="$2"
            local labels="$3"

            # Verifica se a issue já existe pelo título
            existing=$(gh issue list --search "\"$title\" in:title" --json number --jq 'length')

            if [ "$existing" -gt 0 ]; then
              echo "⏩ Issue já existe: $title"
            else
              gh issue create --title "$title" --body "$body" --label "$labels"
              echo "✅ Issue criada: $title"
            fi
          }

          # === Tarefas do Repositório ===
          # Adicione novas chamadas a create_issue_if_not_exists abaixo:

          create_issue_if_not_exists \
            "[DOCS] Completar documentação de estratégia de execução" \
            "Preencher o conteúdo de \`docs/estrategia_execucao.md\` com a estratégia Git, fluxo de branches e guia de contribuição.\n\n**Critérios de Aceite:**\n- [ ] Documento completo e revisado\n- [ ] Links cruzados funcionando" \
            "documentation"

          create_issue_if_not_exists \
            "[DOCS] Completar guia de migração e onboarding" \
            "Preencher \`docs/migration_guide.md\` com o passo a passo de clonagem e onboarding em novas máquinas.\n\n**Critérios de Aceite:**\n- [ ] Testado em máquina limpa\n- [ ] Documento revisado" \
            "documentation"
